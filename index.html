<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f2">
    <meta name="description" content="Upgrade existing lights and devices with SmartHome Wi-Fi modules. Explore point-based bundles, optional installation and a site-visit quotation workflow.">
    <title>SmartHome — control the home you have</title>
    <link rel="stylesheet" href="styles.css">
    <script src="catalog.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="#home" data-tab="home" aria-label="SmartHome home">
          <span class="brand-symbol" aria-hidden="true">⌂</span>
          <span>smart<span class="brand-accent">home</span></span>
        </a>
        <nav class="site-nav" role="tablist" aria-label="Explore SmartHome" aria-orientation="horizontal">
          <button class="nav-tab" id="tab-home" type="button" role="tab" aria-selected="true" aria-controls="panel-home" tabindex="0">Home</button>
          <button class="nav-tab" id="tab-bundles" type="button" role="tab" aria-selected="false" aria-controls="panel-bundles" tabindex="-1">Bundles & packages</button>
          <button class="nav-tab" id="tab-build" type="button" role="tab" aria-selected="false" aria-controls="panel-build" tabindex="-1">Build a bundle</button>
          <button class="nav-tab" id="tab-devices" type="button" role="tab" aria-selected="false" aria-controls="panel-devices" tabindex="-1">Devices</button>
          <button class="nav-tab" id="tab-routines" type="button" role="tab" aria-selected="false" aria-controls="panel-routines" tabindex="-1">Routines</button>
          <button class="nav-tab plan-tab" id="tab-plan" type="button" role="tab" aria-selected="false" aria-controls="panel-plan" tabindex="-1">My plan <span class="plan-count" id="plan-count">0</span></button>
        </nav>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
          <span aria-hidden="true">◐</span><span class="theme-label">Dark</span>
        </button>
      </header>
      <main id="main">
        <div id="storefront"></div>
        <p class="sr-only" id="live-status" role="status" aria-live="polite" aria-atomic="true"></p>
      </main>
      <footer class="site-footer">
        <span class="footer-brand">smart<span class="brand-accent">home</span></span>
        <p>Upgrade the home you have. No renovation. Your switches still work.</p>
        <span class="draft-note">Draft concept · estimates need confirmation</span>
      </footer>
    </div>
    <dialog class="brief-dialog" id="brief-dialog" aria-labelledby="brief-title">
      <div class="dialog-heading">
        <div><p class="eyebrow">Next step</p><h2 id="brief-title">Your site-visit brief</h2></div>
        <button class="icon-button" id="close-brief" type="button" aria-label="Close site-visit brief">×</button>
      </div>
      <div id="brief-content"></div>
      <p class="dialog-disclaimer">This draft stays in your browser. It does not book a visit or send an order.</p>
      <div class="dialog-actions">
        <button class="button button-outline" id="copy-brief" type="button">Copy brief</button>
        <button class="button button-primary" id="done-brief" type="button">Done</button>
      </div>
    </dialog>
    <dialog class="point-dialog" id="point-dialog" aria-labelledby="point-title">
      <div id="point-dialog-content"></div>
    </dialog>
  </body>
</html>
